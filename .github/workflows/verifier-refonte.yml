name: Vérifier la refonte modulaire (sans publier)

on:
  push:
    branches:
      - "refonte/**"
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Vérifier les contrats et les données
        run: |
          node scripts/verifier-site.cjs
          node scripts/verifier-changements.cjs
      - name: Préparer la sortie du site sans publication
        run: node scripts/construire-site.cjs
      - name: Vérifier le coeur sans le Web
        run: MON_RYTHME_WEB=0 node scripts/construire-site.cjs
