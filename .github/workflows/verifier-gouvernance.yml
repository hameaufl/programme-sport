name: Vérifier la gouvernance expérimentale (sans publier)

on:
  push:
    branches:
      - "maturation/architecture-multiagents"
      - "tests/coach-b2-concis"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gouvernance:
    # Les autres PR du dépôt ne doivent pas dépendre des dossiers expérimentaux.
    if: github.ref == 'refs/heads/maturation/architecture-multiagents' || github.ref == 'refs/heads/tests/coach-b2-concis' || github.head_ref == 'maturation/architecture-multiagents' || github.head_ref == 'tests/coach-b2-concis'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique et les références main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier la traçabilité des rôles et des décisions
        run: node maturation/gouvernance/verifier-referentiel.cjs
      - name: Vérifier les préconditions des opérations sensibles fictives
        run: node maturation/gouvernance/verifier-autorisations.cjs
      - name: Vérifier les huit exemples de réponse B2 (test statique, non comportemental)
        run: node maturation/gouvernance/verifier-concision-b2.cjs
      - name: Tester les cas de refus des vérificateurs
        run: node --test maturation/gouvernance/tests/*.test.cjs
      - name: Contrôler les traces des simulations, sans attribuer de gain fictif
        run: node maturation/gouvernance/verifier-simulations.cjs
      - name: Vérifier le statut et les données d'évaluation A/B (aucun gain inventé)
        run: node maturation/gouvernance/verifier-evaluation-ab.cjs
      - name: Contrôler l'arithmétique des résultats observés B/B2 et les réserves
        run: node maturation/gouvernance/verifier-resultats-b2.cjs
      - name: Contrôler la préparation des deux contre-tests B2 sans résultats inventés
        run: node maturation/gouvernance/verifier-contretests-b2.cjs
      - name: Vérifier que B2 reste un candidat non activé et sans fausse approbation
        run: node maturation/gouvernance/verifier-porte-adoption-b2.cjs
      - name: Contrôler les 161 rubriques historiques et les anomalies des 85 références
        run: node maturation/gouvernance/verifier-audit-semantique.cjs
      - name: Vérifier les huit qualifications INC et leurs preuves historiques
        run: node maturation/gouvernance/verifier-qualifications-inc.cjs
      - name: Contrôler l'inventaire de nettoyage sans autorisation de suppression
        run: node maturation/gouvernance/verifier-assainissement.cjs
      - name: Contrôler le mini-lot documentaire et les 26 propositions sans suppression
        run: node maturation/gouvernance/verifier-preparation-nettoyage.cjs
      - name: Contrôler les 29 rubriques de séparation Coach Maturation en V2
        run: node maturation/gouvernance/verifier-revue-roles.cjs
      - name: Vérifier la non-perte métier contre le SHA initial et le main actuel
        run: node maturation/gouvernance/verifier-integrite-metier.cjs
