name: Publier Mon Rythme

on:
  push:
    branches: [main]
    paths:
      - "addons/web/**"
      - "domaines/**"
      - "adaptateurs/**"
      - "contrats/**"
      - publication.txt
      - "scripts/**"
      - .github/workflows/publier-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mon-rythme-pages
  cancel-in-progress: true

jobs:
  build:
    name: Vérifier et préparer le site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Contrôler le site et les données
        run: |
          node scripts/verifier-site.cjs
          node scripts/verifier-changements.cjs
          node maturation/architecture/verifier-portabilite.cjs
          node maturation/architecture/verifier-frontieres.cjs

      - name: Vérifier la politique de publication restreinte
        run: |
          MON_RYTHME_POLITIQUE=prive node scripts/construire-site.cjs
          node maturation/architecture/verifier-publication-prive.cjs
      - name: Générer les vues hebdomadaires et le suivi public existant
        run: node scripts/construire-site.cjs

      - name: Vérifier la fidélité du miroir Web aux données métier
        run: node scripts/verifier-miroir-web.cjs

      - name: Contrôler l'absence de fichiers externes dans le site public
        run: node maturation/architecture/verifier-publication.cjs

      - name: Envoyer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Vérifier et publier sur Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attendre la disponibilité de l'artefact via GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo "0")"
            if [ "$count" = "1" ]; then
              echo "Artefact github-pages visible (essai $attempt)."
              sleep 5
              exit 0
            fi
            echo "Artefact non visible (essai $attempt/12) ; nouvel essai dans 5 s."
            sleep 5
          done
          echo "::error::Artefact github-pages introuvable ; déploiement non lancé."
          exit 1

      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Contrôler la version réellement publiée
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          attendu="${GITHUB_SHA:0:12}"
          for essai in $(seq 1 12); do
            reponse="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${SITE_URL%/}/data/index.json?rev=${GITHUB_SHA}" || true)"
            version="$(printf '%s' "$reponse" | jq -r '.buildVersion // empty' 2>/dev/null || true)"
            if [ "$version" = "$attendu" ]; then
              echo "Miroir Web publié et vérifié : $version"
              exit 0
            fi
            echo "Version visible : ${version:-indisponible} ; attendue : $attendu (essai $essai/12)."
            sleep 5
          done
          echo "::error::La publication n'expose pas encore le commit $attendu."
          exit 1
