name: Publier Mon Rythme

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sante.html
      - "personnel/**"
      - favicon.svg
      - icon-192.png
      - icon-512.png
      - manifest.webmanifest
      - publication.txt
      - scripts/verifier-site.cjs
      - .github/workflows/publier-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mon-rythme-pages
  cancel-in-progress: true

jobs:
  build:
    name: Vérifier et préparer le site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Contrôler le site et les données
        run: node scripts/verifier-site.cjs

      - name: Préparer les fichiers à publier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html sante.html favicon.svg icon-192.png icon-512.png manifest.webmanifest publication.txt _site/
          mkdir -p _site/personnel
          cp personnel/programme.js _site/personnel/programme.js
          mkdir -p _site/personnel/sante
          cp personnel/sante/PROFIL.md personnel/sante/SUIVI.md _site/personnel/sante/
          if [ -d personnel/pieces-jointes/seances ]; then
            mkdir -p _site/personnel/pieces-jointes
            cp -R personnel/pieces-jointes/seances _site/personnel/pieces-jointes/
          fi
          touch _site/.nojekyll

      - name: Envoyer l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Vérifier et publier sur Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attendre la disponibilité de l'artefact via GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo "0")"
            if [ "$count" = "1" ]; then
              echo "Artefact github-pages visible (essai $attempt)."
              sleep 5
              exit 0
            fi
            echo "Artefact non visible (essai $attempt/12) ; nouvel essai dans 5 s."
            sleep 5
          done
          echo "::error::Artefact github-pages introuvable ; déploiement non lancé."
          exit 1

      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
