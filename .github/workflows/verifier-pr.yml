name: Vérifier les changements (sans publier)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier les contrats et les données
        run: |
          node scripts/verifier-site.cjs
          node scripts/verifier-changements.cjs
          node scripts/controle/verifier-portabilite.cjs
          node scripts/controle/verifier-frontieres.cjs
      - name: Préparer la sortie du site sans publication
        run: node scripts/construire-site.cjs
      - name: Contrôler la publication standard
        run: node scripts/controle/verifier-publication.cjs
      - name: Préparer la publication restreinte et vérifier les fuites
        run: |
          MON_RYTHME_POLITIQUE=prive node scripts/construire-site.cjs
          node scripts/controle/verifier-publication-prive.cjs
      - name: Vérifier le coeur sans le Web
        run: MON_RYTHME_WEB=0 node scripts/construire-site.cjs
