<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234735">
  <meta name="description" content="Programme de sorties sportives : planning hebdomadaire et détail des séances.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Mon Rythme · Programme Sport</title>
  <style>
    :root {color-scheme:light;--bg:#f6f8f4;--ink:#22392b;--muted:#6b7f70;--line:#dfe8dd;--green:#234735;--soft:#edf5eb;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8bba97;outline-offset:3px}
    .shell{width:min(1090px,calc(100% - 36px));margin:0 auto;padding-bottom:65px}
    header{min-height:87px;display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:-.5px}
    .brand-icon{width:41px;height:41px;background:var(--green);color:white;border-radius:13px;display:grid;place-items:center;font-size:22px}
    #todayLabel{font-size:12px;color:var(--muted);text-align:right;text-transform:capitalize}
    .hero{background:var(--green);color:white;border-radius:23px;padding:34px 40px}
    .eyebrow{margin:0 0 8px;color:#cce2d0;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
    h1{font-size:clamp(29px,4.6vw,44px);letter-spacing:-1.4px;line-height:1.14;margin:0}
    section{margin-top:29px}
    .section-top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
    h2{margin:0;font-size:23px;letter-spacing:-.6px}
    .help{font-size:13px;color:var(--muted);margin:3px 0 0}
    .week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .week-nav button{border:1px solid var(--line);background:white;color:var(--green);min-width:37px;border-radius:11px;padding:8px 11px;font-weight:700}
    .week-nav button:hover{background:var(--soft)}
    #rangeLabel{min-width:163px;text-align:center;font-size:13px;font-weight:800}
    .week-nav .today{border-color:transparent;background:transparent;font-size:12px}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
    .day{min-width:0;min-height:145px;background:white;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:17px;padding:16px 12px}
    .day:hover{border-color:#8fb397}.day[aria-pressed="true"]{border:2px solid #427554;background:#f0f7ef;padding:15px 11px}
    .day .short{font-size:12px;color:#7d917e;font-weight:800;text-transform:uppercase}
    .day .num{font-size:27px;line-height:1;font-weight:800}
    .day .month{font-size:11px;color:#84978a}
    .day .status{margin-top:auto;color:#98a59b;font-size:12px}
    .day .status.planned{color:#286c3c;font-weight:750}
    .day .status.planned:before{content:"";display:inline-block;background:#75a77e;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .panel{background:white;border:1px solid var(--line);border-radius:19px;padding:23px}
    .panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:17px}
    .panel-header h2{font-size:20px}
    #selectedDate{background:var(--soft);color:#406a4a;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;text-transform:capitalize}
    .empty{background:#f6f9f4;border-radius:13px;padding:18px;color:#708275;font-size:14px}
    .empty strong{display:block;color:#45604b}.empty p{margin:4px 0 0}
    .sessions{display:grid;gap:12px}
    .session{border:1px solid #dfe9dc;background:#fafcf9;border-radius:14px;padding:18px 20px}
    .session h3{font-size:17px;margin:0}.session .meta{color:#63816b;font-size:12px;margin:7px 0 0}
    .session .detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:10px 0 0}
    .session ol{font-size:14px;padding-left:21px;margin:10px 0 0}.session li+li{margin-top:6px}
    .week-list{display:grid;gap:9px}.week-item{display:flex;gap:13px;align-items:baseline;background:white;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .week-item .date{width:106px;flex:none;font-size:12px;font-weight:800;color:#406b4d}
    .week-item .body{font-size:14px}.week-item .body small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .goal-list{margin:10px 0 0;padding-left:23px;color:var(--muted);font-size:14px}
    .goal-list li{padding-left:4px}
    .session-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .done-control{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:#395b42;font-size:13px;font-weight:650;cursor:pointer}
    .done-control input{width:18px;height:18px;margin:0;accent-color:#306f42;cursor:pointer}
    .session.completed,.week-item.completed{background:#f0f7ef}
    .week-item .done-control{margin-left:auto;align-self:center}
    .day .status.complete{color:#2a7042}
    .day .status.complete:before{background:#2a7042}
    @media(max-width:930px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:650px){.week-item{flex-wrap:wrap}.week-item .done-control{margin-left:0}.shell{width:calc(100% - 28px)}header{min-height:73px}.brand{font-size:18px}.hero{border-radius:19px;padding:27px 23px}.section-top{align-items:start;flex-direction:column}.week-nav{width:100%}#rangeLabel{flex:1;min-width:125px}.days{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.day{min-height:116px;padding:12px}.day[aria-pressed="true"]{padding:11px}.day .num{font-size:23px}.panel{padding:19px}.week-item .date{width:85px}}
    @media print{body{background:white}.shell{width:100%;padding:0 14px}.hero{background:white;color:var(--ink);border:1px solid var(--line)}.eyebrow{color:var(--ink)}.week-nav{display:none}.days{grid-template-columns:repeat(7,minmax(0,1fr))}.day{min-height:100px;padding:8px!important}.day[aria-pressed="true"]{border-width:1px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><span aria-hidden="true" class="brand-icon">↗</span><span>mon rythme.</span></div><time id="todayLabel"></time></header>
  <main>
    <div class="hero"><p class="eyebrow">Programme Sport</p><h1>Mon programme.</h1></div>
    <section aria-labelledby="goalsHeading" class="goals">
      <div class="section-top"><div>
        <h2 id="goalsHeading">Mes objectifs</h2>
        <ul class="goal-list"><li>La priorité est de retrouver des sensations agréables, sans recherche de performance.</li></ul>
      </div></div>
    </section>
    <section aria-labelledby="headingWeek">
      <div class="section-top">
        <div><h2 id="headingWeek">Mon calendrier</h2></div>
        <nav class="week-nav" aria-label="Navigation entre les semaines">
          <button type="button" id="previous" aria-label="Semaine précédente">‹</button>
          <span id="rangeLabel" aria-live="polite"></span>
          <button type="button" id="following" aria-label="Semaine suivante">›</button>
          <button type="button" id="reset" class="today">Semaine en cours</button>
        </nav>
      </div>
      <div id="days" class="days" aria-label="Les sept jours"></div>
    </section>
    <section aria-labelledby="headingDay">
      <div class="panel">
        <div class="panel-header"><h2 id="headingDay">Programme du jour</h2><span id="selectedDate"></span></div>
        <div id="dayContent" aria-live="polite"></div>
      </div>
    </section>
    <section aria-labelledby="headingAll">
      <div class="section-top"><div><h2 id="headingAll">Séances de la semaine</h2><p class="help">Course et kiné programmées pour la semaine sélectionnée.</p></div></div>
      <div id="allContent" aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="./programme.js"></script>
<script>
(function () {
  "use strict";
  var today=new Date();
  var weekStart=monday(today);
  var dayIndex=(today.getDay()+6)%7;
  // Semaines civiles du lundi au dimanche, indépendantes des dates de début du cycle.
  function monday(date) {var d=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);d.setDate(d.getDate()-(d.getDay()+6)%7);return d;}
  function plus(date,n) {var d=new Date(date);d.setDate(d.getDate()+n);return d;}
  function key(date) {return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");}
  function format(date,parts) {return new Intl.DateTimeFormat("fr-FR",parts).format(date);}
  function elem(tag,cls,content) {var node=document.createElement(tag);if(cls)node.className=cls;if(content!==undefined)node.textContent=content;return node;}
  function getWeek() {
    var source=window.MON_RYTHME_PROGRAMMES||{};
    var found=source[key(weekStart)];
    return Array.isArray(found)?found.filter(function(s){return s&&typeof s.date==="string";}).slice().sort(function(a,b){return a.date.localeCompare(b.date)||String(a.heure||"").localeCompare(String(b.heure||""));}):[];
  }
  function getDay(i) {var target=key(plus(weekStart,i));return getWeek().filter(function(s){return s.date===target;});}
  function metadata(s) {return [s.heure,s.duree,s.distance].filter(Boolean).join(" · ");}
  function empty(title,note) {var box=elem("div","empty");box.appendChild(elem("strong","",title));box.appendChild(elem("p","",note));return box;}
  // Le suivi reste sur cet appareil et n'est jamais envoyé à GitHub.
  var savedKey="mon-rythme-suivi-v1";
  var completed={};
  try {
    var stored=JSON.parse(localStorage.getItem(savedKey)||"{}");
    if(stored && typeof stored==="object" && !Array.isArray(stored))completed=stored;
  } catch(e) {}
  function sessionId(s) {return s.id||((s.type==="kine"?"kine":"course")+"-"+s.date);}
  function isCompleted(s) {return completed[sessionId(s)]===true;}
  function markCompleted(id,checked) {
    if(checked)completed[id]=true;
    else delete completed[id];
    try {localStorage.setItem(savedKey,JSON.stringify(completed));}catch(e) {}
    render();
  }
  function completionControl(s) {
    var label=elem("label","done-control");
    var input=elem("input");
    input.type="checkbox";input.dataset.sessionId=sessionId(s);
    input.checked=isCompleted(s);
    input.setAttribute("aria-label",(s.titre||"Séance")+" du "+s.date+" réalisée");
    label.appendChild(input);
    label.appendChild(elem("span","","Réalisé"));
    return label;
  }
  function render() {
    var end=plus(weekStart,6);
    document.getElementById("rangeLabel").textContent=format(weekStart,{day:"numeric",month:"short"})+" – "+format(end,{day:"numeric",month:"short",year:"numeric"});
    var days=document.getElementById("days");days.replaceChildren();
    for (var i=0;i<7;i++) {
      var d=plus(weekStart,i), count=getDay(i).length;
      var btn=elem("button","day");
      btn.type="button";btn.dataset.day=String(i);
      btn.setAttribute("aria-pressed",String(i===dayIndex));
      var dailySessions=getDay(i),done=dailySessions.filter(isCompleted).length;
      btn.setAttribute("aria-label",format(d,{weekday:"long",day:"numeric",month:"long"})+", "+count+" séance(s), "+done+" réalisée(s)");
      btn.appendChild(elem("span","short",format(d,{weekday:"short"})+(key(d)===key(today)?" · auj.":"")));
      btn.appendChild(elem("span","num",String(d.getDate())));
      btn.appendChild(elem("span","month",format(d,{month:"long"})));
      var sessions=getDay(i);var hasKine=sessions.some(function(s){return s.type==="kine";});var hasCourse=sessions.some(function(s){return s.type!=="kine";});
      var label=hasKine&&hasCourse?"Course + kiné":hasKine?"Kiné":hasCourse?"Course":"—";
      var allCompleted=count>0&&done===count;
      btn.appendChild(elem("span","status"+(count?" planned":"")+(allCompleted?" complete":""),allCompleted?"✓ "+label:label));
      days.appendChild(btn);
    }
    var selected=plus(weekStart,dayIndex);
    document.getElementById("selectedDate").textContent=format(selected,{weekday:"long",day:"numeric",month:"long"});
    var dayContent=document.getElementById("dayContent");dayContent.replaceChildren();
    var sessions=getDay(dayIndex);
    if (!sessions.length) dayContent.appendChild(empty("Aucune séance programmée","Aucune séance prévue ce jour."));
    else {
      var cards=elem("div","sessions");
      sessions.forEach(function(s) {
        var box=elem("article","session"+(isCompleted(s)?" completed":""));
        var head=elem("div","session-head");
        head.appendChild(elem("h3","",s.titre||"Sortie"));
        head.appendChild(completionControl(s));
        box.appendChild(head);
        if (metadata(s))box.appendChild(elem("p","meta",metadata(s)));
        if (s.objectif)box.appendChild(elem("p","detail","Objectif : "+s.objectif));
        if (s.details)box.appendChild(elem("p","detail",s.details));
        if (Array.isArray(s.etapes)&&s.etapes.length){var list=elem("ol");s.etapes.forEach(function(step){list.appendChild(elem("li","",step));});box.appendChild(list);}
        cards.appendChild(box);
      });
      dayContent.appendChild(cards);
    }
    var all=document.getElementById("allContent");all.replaceChildren();
    var items=getWeek();
    if (!items.length)all.appendChild(empty("Aucune séance cette semaine","Aucune séance n'est programmée pour cette période."));
    else {
      var list=elem("div","week-list");
      items.forEach(function(s){
        var date=new Date(s.date+"T12:00:00");
        if (Number.isNaN(date.getTime()))return;
        var item=elem("div","week-item"+(isCompleted(s)?" completed":""));
        item.appendChild(elem("span","date",format(date,{weekday:"short",day:"numeric",month:"short"})));
        var body=elem("div","body");
        body.appendChild(elem("strong","",s.titre||"Sortie"));
        if (metadata(s))body.appendChild(elem("small","",metadata(s)));
        item.appendChild(body);
        item.appendChild(completionControl(s));
        list.appendChild(item);
      });
      all.appendChild(list);
    }
  }
  function refreshToday() {
    var newToday=new Date();
    if (key(newToday)===key(today))return;
    var displayingCurrentWeek=key(weekStart)===key(monday(today));
    var displayingToday=key(plus(weekStart,dayIndex))===key(today);
    today=newToday;
    if(displayingCurrentWeek&&displayingToday){
      weekStart=monday(today);
      dayIndex=(today.getDay()+6)%7;
    }
    document.getElementById("todayLabel").textContent=format(today,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    render();
  }
  document.getElementById("todayLabel").textContent=format(today,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("previous").addEventListener("click",function(){weekStart=plus(weekStart,-7);dayIndex=0;render();});
  document.getElementById("following").addEventListener("click",function(){weekStart=plus(weekStart,7);dayIndex=0;render();});
  document.getElementById("reset").addEventListener("click",function(){var now=new Date();weekStart=monday(now);dayIndex=(now.getDay()+6)%7;render();});
  document.getElementById("days").addEventListener("click",function(event){var button=event.target.closest("button[data-day]");if(button){dayIndex=Number(button.dataset.day);render();}});
  ["dayContent","allContent"].forEach(function(containerId){
    document.getElementById(containerId).addEventListener("change",function(event){
      var control=event.target.closest("input[data-session-id]");
      if(control)markCompleted(control.dataset.sessionId,control.checked);
    });
  });
  render();
  // Une page laissée ouverte pendant la nuit affiche la nouvelle date sans rechargement.
  setInterval(refreshToday,60000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState!=="visible")return;
    refreshToday();
    var script=document.createElement("script");script.src="./programme.js?maj="+Date.now();
    script.onload=function(){script.remove();render();};script.onerror=function(){script.remove();};
    document.head.appendChild(script);
  });
}());
</script>
</body>
</html>
