<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234735">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="mon-rythme-version" content="2026-11-12-liste-seances-sans-resume-v19">
  <meta name="description" content="Programme de sorties sportives : planning hebdomadaire et détail des séances.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Mon Rythme · Programme Sport</title>
  <style>
    :root {color-scheme:light;--bg:#f6f8f4;--ink:#22392b;--muted:#6b7f70;--line:#dfe8dd;--green:#234735;--soft:#edf5eb;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8bba97;outline-offset:3px}
    .shell{width:min(1090px,calc(100% - 36px));margin:0 auto;padding-bottom:65px}
    header{min-height:87px;display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:-.5px}
    .brand-icon{width:41px;height:41px;background:var(--green);color:white;border-radius:13px;display:grid;place-items:center;font-size:22px}
    #todayLabel{font-size:12px;color:var(--muted);text-align:right;text-transform:capitalize}
    .hero{background:var(--green);color:white;border-radius:23px;padding:34px 40px}
    .eyebrow{margin:0 0 8px;color:#cce2d0;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
    h1{font-size:clamp(29px,4.6vw,44px);letter-spacing:-1.4px;line-height:1.14;margin:0}
    section{margin-top:29px}
    .section-top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
    h2{margin:0;font-size:23px;letter-spacing:-.6px}
    .help{font-size:13px;color:var(--muted);margin:3px 0 0}
    .week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .week-nav button{border:1px solid var(--line);background:white;color:var(--green);min-width:37px;border-radius:11px;padding:8px 11px;font-weight:700}
    .week-nav button:hover{background:var(--soft)}
    #rangeLabel{min-width:163px;text-align:center;font-size:13px;font-weight:800}
    .week-nav .today{border-color:#94b29a;background:#e1f0e3;color:#234735;font-size:12px;padding:8px 13px;box-shadow:0 1px 3px rgba(35,71,53,.12)}
    .week-nav .today:hover{border-color:#719b7a;background:#d0e7d4;box-shadow:0 2px 5px rgba(35,71,53,.16)}
    .week-nav .today:active{background:#c0ddc6;box-shadow:none}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
    .day{min-width:0;min-height:145px;background:white;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:17px;padding:16px 12px}
    .day:hover{border-color:#8fb397}.day[aria-pressed="true"]{border:2px solid #427554;background:#f0f7ef;padding:15px 11px}
    .day .short{font-size:12px;color:#7d917e;font-weight:800;text-transform:uppercase}
    .day .num{font-size:27px;line-height:1;font-weight:800}
    .day .month{font-size:11px;color:#84978a}
    .day .status{margin-top:auto;color:#98a59b;font-size:12px}
    .day .status.planned{color:#286c3c;font-weight:750}
    .day .status.planned:before{content:"";display:inline-block;background:#75a77e;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
    .panel{background:white;border:1px solid var(--line);border-radius:19px;padding:23px}
    .panel-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:17px}
    .panel-header h2{font-size:20px}
    #selectedDate{background:var(--soft);color:#406a4a;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;text-transform:capitalize}
    .empty{background:#f6f9f4;border-radius:13px;padding:18px;color:#708275;font-size:14px}
    .empty strong{display:block;color:#45604b}.empty p{margin:4px 0 0}
    .sessions{display:grid;gap:12px}
    .session{border:1px solid #dfe9dc;background:#fafcf9;border-radius:14px;padding:18px 20px}
    .session h3{font-size:17px;margin:0}.session .meta{color:#63816b;font-size:12px;margin:7px 0 0}
    .session .detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:10px 0 0}
    .session ul{font-size:14px;padding-left:21px;margin:9px 0 0}.session li+li{margin-top:6px}
    .session-programme{margin-top:17px;min-width:0}
    .session-programme h4{color:#395b42;font-size:14px;font-weight:750;margin:0 0 6px}
    .session-programme .program-notes{font-size:14px;color:#607a66;margin:6px 0 9px;white-space:pre-wrap;overflow-wrap:anywhere}
    .session-programme .program-empty{font-size:13px;color:#7a8d7c;margin:5px 0 0;font-style:italic}
    .session-garmin{margin-top:13px;display:flex;flex-direction:column;align-items:start;gap:5px}
    .garmin-download{color:#234735;font-size:14px;font-weight:750;text-decoration:underline;text-underline-offset:3px}
    .garmin-download:focus-visible{outline:3px solid #86b896;outline-offset:3px}
    .session-structures{margin-top:18px;padding-top:15px;border-top:1px solid #dce8df;min-width:0}
    .session-structures h4{color:#395b42;font-size:14px;font-weight:750;margin:0 0 6px}
    .session-structures ul{color:#4e6955;overflow-wrap:anywhere}
    .session-structures .structures-empty{color:#7a8d7c;font-size:13px;font-style:italic;margin:6px 0 0}
    .week-list{display:grid;gap:9px}
    .week-item{display:flex;gap:13px;align-items:center;background:white;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .week-item .date{width:106px;flex:none;font-size:12px;font-weight:800;color:#406b4d}
    .week-item .body{font-size:14px;min-width:0;flex:1;overflow-wrap:anywhere}
    .goal-list{margin:10px 0 0;padding-left:23px;color:var(--muted);font-size:14px}
    .goal-list li{padding-left:4px}
    .session-head{display:flex;justify-content:flex-start;align-items:center;gap:10px 14px;flex-wrap:wrap}
    .session-head h3{min-width:0;overflow-wrap:anywhere}
    .exercise-help{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:16px;height:16px;min-width:16px;margin-left:3px;padding:0;border:1px solid #708978;border-radius:50%;color:#234735;font-size:10px;font-weight:800;line-height:1;background:#f0f7ef;white-space:nowrap;cursor:pointer}
    .exercise-help:hover{background:#dcecdf}.exercise-help:focus-visible{outline:2px solid #86b896;outline-offset:2px}
    .exercise-dialog{position:fixed;box-sizing:border-box;width:min(94vw,660px);max-height:92dvh;border:1px solid #d8e8df;border-radius:18px;padding:18px 16px 12px;background:#fff;color:#22392b;box-shadow:0 20px 70px #14251a50}
    .exercise-dialog::backdrop{background:rgba(10,25,16,.72)}
    .exercise-dialog h2{margin:0 36px 12px 0;font-size:16px;line-height:1.25}
    .exercise-dialog img{display:block;width:100%;height:auto;max-height:calc(92dvh - 92px);object-fit:contain}
    .exercise-close{position:absolute;top:9px;right:9px;width:30px;height:30px;padding:0;border:1px solid #b9cbbd;border-radius:50%;background:#f5faf5;color:#234735;font-size:22px;line-height:1;cursor:pointer}
    .sensations-entry{margin-top:18px;padding-top:15px;border-top:1px solid #dce8df;min-width:0}
    .sensations-entry h4{color:#395b42;font-size:14px;font-weight:750;margin:0 0 6px}
    .sensations-entry .note{color:#4e6955;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.55}
    .done-control{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:#286b3b;font-size:13px;font-weight:700}
    .done-mark{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#2d7b46;color:white;font-size:13px;line-height:1;font-weight:850}
    .session.completed,.week-item.completed{background:#f0f7ef}
    .health-preview{background:#edf5eb;border:1px solid #cce1d0;border-radius:20px;padding:20px 25px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}
    .health-preview h2{font-size:21px;margin:0}
    .health-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#234735;color:#fff;text-decoration:none;font-size:14px;font-weight:750;padding:13px 20px;border-radius:13px;min-height:46px;white-space:nowrap}
    .health-cta:hover{background:#335f43}.health-cta:focus-visible{outline:3px solid #86b896;outline-offset:3px}
    .week-item .done-control{margin-left:auto;flex:none}
    .day .status.complete{color:#2a7042}
    .day .status.complete:before{background:#2a7042}
    @media(max-width:930px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:650px){.health-preview{padding:17px 15px;gap:10px}.health-preview h2{font-size:18px}.health-cta{padding:11px 12px;font-size:12px;min-height:43px}.week-item{flex-wrap:wrap;gap:8px 10px}.week-item .done-control{margin-left:auto}.shell{width:calc(100% - 28px)}header{min-height:73px}.brand{font-size:18px}.hero{border-radius:19px;padding:27px 23px}.section-top{align-items:start;flex-direction:column}.week-nav{width:100%}#rangeLabel{flex:1;min-width:125px}.days{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.day{min-height:116px;padding:12px}.day[aria-pressed="true"]{padding:11px}.day .num{font-size:23px}.panel{padding:19px}.week-item .date{width:85px}}
    @media(max-width:350px){.health-preview{grid-template-columns:1fr}.health-cta{width:100%}}
    @media print{body{background:white}.shell{width:100%;padding:0 14px}.hero{background:white;color:var(--ink);border:1px solid var(--line)}.eyebrow{color:var(--ink)}.week-nav{display:none}.days{grid-template-columns:repeat(7,minmax(0,1fr))}.day{min-height:100px;padding:8px!important}.day[aria-pressed="true"]{border-width:1px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><span aria-hidden="true" class="brand-icon">↗</span><span>mon rythme.</span></div><time id="todayLabel"></time></header>
  <main>
    <div class="hero"><p class="eyebrow">Programme Sport</p><h1>Mon programme.</h1></div>
    <section aria-labelledby="goalsHeading" class="goals">
      <div class="section-top"><div>
        <h2 id="goalsHeading">Mes objectifs</h2>
        <ul class="goal-list" id="goalsList"></ul>
      </div></div>
    </section>
    <section aria-labelledby="headingWeek">
      <div class="section-top">
        <div><h2 id="headingWeek">Mon calendrier</h2></div>
        <nav class="week-nav" aria-label="Navigation entre les semaines">
          <button type="button" id="previous" aria-label="Semaine précédente">‹</button>
          <span id="rangeLabel" aria-live="polite"></span>
          <button type="button" id="following" aria-label="Semaine suivante">›</button>
          <button type="button" id="reset" class="today">Semaine en cours</button>
        </nav>
      </div>
      <div id="days" class="days" aria-label="Les sept jours"></div>
    </section>
    <section aria-labelledby="headingDay">
      <div class="panel">
        <div class="panel-header"><h2 id="headingDay">Programme du jour</h2><span id="selectedDate"></span></div>
        <div id="dayContent" aria-live="polite"></div>
      </div>
    </section>
    <section aria-labelledby="headingAll">
      <div class="section-top"><h2 id="headingAll">Séances de la semaine</h2></div>
      <div id="allContent" aria-live="polite"></div>
    </section>
    <section aria-labelledby="headingHealth">
      <div class="health-preview">
        <h2 id="headingHealth">Mon suivi santé</h2>
        <a class="health-cta" href="./sante.html">Voir le suivi <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
</div>
<dialog id="exerciseDialog" class="exercise-dialog" aria-labelledby="exerciseTitle">
  <button type="button" id="exerciseClose" class="exercise-close" aria-label="Fermer le schéma">×</button>
  <h2 id="exerciseTitle"></h2>
  <img id="exerciseImage" alt="">
</dialog>
<script>
(function () {
  "use strict";
  document.getElementById("exerciseClose").addEventListener("click",function(){closeExerciseHelp();});
  document.getElementById("exerciseDialog").addEventListener("click",function(event){
    if(event.target===this)closeExerciseHelp();
  });
  var today=new Date();
  var weekStart=monday(today),dayIndex=(today.getDay()+6)%7;
  var objectifs=[],dataIndex={semaines:[]},currentSessions=[],cache=new Map(),requestToken=0;
  function monday(date) {var d=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);d.setDate(d.getDate()-(d.getDay()+6)%7);return d;}
  function plus(date,n) {var d=new Date(date);d.setDate(d.getDate()+n);return d;}
  function key(date) {return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");}
  function format(date,parts) {return new Intl.DateTimeFormat("fr-FR",parts).format(date);}
  function elem(tag,cls,content) {var node=document.createElement(tag);if(cls)node.className=cls;if(content!==undefined)node.textContent=content;return node;}
  function getWeek() {return currentSessions;}
  function getDay(i) {var target=key(plus(weekStart,i));return getWeek().filter(function(s){return s.date===target;});}
  function metadata(s) {return [s.heure,s.duree,s.distance].filter(Boolean).join(" · ");}
  function empty(title,note) {var box=elem("div","empty");box.appendChild(elem("strong","",title));box.appendChild(elem("p","",note));return box;}
  // Statut et sensations : donnés statiques de programme.js, sans stockage navigateur.
  function isCompleted(s) {return s.fait===true;}
  function completionDisplay(s) {
    if(!isCompleted(s))return null;
    var label=elem("span","done-control");
    label.setAttribute("aria-label",(s.titre||"Séance")+" : fait");
    var check=elem("span","done-mark","✓");
    check.setAttribute("aria-hidden","true");
    label.appendChild(check);
    label.appendChild(elem("span","","Fait"));
    return label;
  }
  function sensationsDisplay(s) {
    if(typeof s.sensations!=="string"||!s.sensations.trim())return null;
    var box=elem("div","sensations-entry");
    box.appendChild(elem("h4","","Sensations"));
    box.appendChild(elem("p","note",s.sensations.trim()));
    return box;
  }
  // Déroulé factuel : exercices déclarés par le Coach ou description « Réalisé » du journal de santé.
  // Ne jamais utiliser les étapes prévues comme preuve de réalisation.
  function derouleDisplay(s) {
    var box=elem("section","session-programme");
    box.appendChild(elem("h4","",isCompleted(s)?"Séance":"Programme prévu"));
    var activities=isCompleted(s)
      ? (Array.isArray(s.exercicesRealises) && s.exercicesRealises.length
          ? s.exercicesRealises
          : (s.exercicesDuRapport||[]))
      : (Array.isArray(s.etapes)?s.etapes:[]);
    activities=activities.filter(function(item){return typeof item==="string"&&item.trim();});
    if(activities.length) {
      var list=elem("ul");
      activities.forEach(function(item){
        var li=elem("li","",item.trim());
        var aids=Array.isArray(s.aidesExercices)?s.aidesExercices:[];
        var aid=aids.find(function(a){
          return a&&typeof a.png==="string"&&/^assets\/renfo\/png\/[a-z0-9-]+\.png$/.test(a.png)&&
            (a.exercice===item||a.exercice.split(" · ")[0]===item.split(" · ")[0]);
        });
        if(aid){
          var help=elem("button","exercise-help","?");
          help.type="button";
          help.setAttribute("aria-label","Voir le schéma : "+item);
          help.title="Afficher le schéma";
          help.addEventListener("click",function(){showExerciseHelp(aid.png,item);});
          li.appendChild(document.createTextNode("\u00a0"));
          li.appendChild(help);
        }
        list.appendChild(li);
      });
      box.appendChild(list);
    } else {
      box.appendChild(elem("p","program-empty",isCompleted(s)
        ?"Les exercices effectués n'ont pas encore été détaillés."
        :"Le contenu de cette séance n'a pas encore été précisé."));
    }
    if(!isCompleted(s) && s.type!=="renfo"){
      if(s.objectif)box.appendChild(elem("p","program-notes","Objectif : "+s.objectif));
      if(s.details)box.appendChild(elem("p","program-notes",s.details));
    }
    return box;
  }
  function showExerciseHelp(png,exercise){
    var dialog=document.getElementById("exerciseDialog");
    if(!dialog||!/^assets\/renfo\/png\/[a-z0-9-]+\.png$/.test(png))return;
    document.getElementById("exerciseImage").src="./"+png;
    document.getElementById("exerciseImage").alt="Schéma du mouvement : "+exercise;
    document.getElementById("exerciseTitle").textContent=exercise.split(" · ")[0];
    if(typeof dialog.showModal==="function")dialog.showModal();
    else dialog.setAttribute("open","");
  }
  function closeExerciseHelp(){
    var dialog=document.getElementById("exerciseDialog");
    if(typeof dialog.close==="function")dialog.close();
    else dialog.removeAttribute("open");
  }
  // Une pièce jointe prévue ne représente jamais une activité enregistrée.
  function fitDisplay(s) {
    var files=Array.isArray(s.pieces_jointes)?s.pieces_jointes:[];
    var entry=files.find(function(f){return f&&f.role==="entrainement_prevu"&&f.format==="fit"&&typeof f.chemin==="string"&&f.chemin.startsWith("personnel/pieces-jointes/seances/"+s.id+"/prevu/")&&f.chemin.endsWith(".fit");});
    if(!entry)return null;
    var box=elem("div","session-garmin"),link=elem("a","garmin-download","Télécharger l'entraînement Garmin (.FIT)");
    link.href="./"+entry.chemin;
    link.download=entry.chemin.split("/").pop();
    box.appendChild(link);
    return box;
  }
  // Ne pas déduire de muscles ou tendons depuis les exercices : seul le Coach documente ces structures.
  // Présentation brève : les précautions générales sur une analyse biomécanique
  // ne font pas partie des noms anatomiques affichés dans cette liste.
  function libelleAnatomique(text) {
    return text.replace(/\s*\((?:(?:sollicitation|activation)\s+probable|probable(?:ment)?|non\s+(?:prouvée|démontrée|confirmée|attestée)\s+cliniquement|hypothèse)[^()]*\)/gi,"").trim();
  }
  function structuresDisplay(s) {
    if(!isCompleted(s))return null;
    var box=elem("section","session-structures");
    box.appendChild(elem("h4","","Structures sollicitées"));
    var items=Array.isArray(s.structuresSollicitees)&&s.structuresSollicitees.length
      ? s.structuresSollicitees
      : (s.structuresDuRapport||[]);
    items=items.filter(function(item){return typeof item==="string"&&libelleAnatomique(item);});
    if(items.length) {
      var list=elem("ul");
      items.forEach(function(item){list.appendChild(elem("li","",libelleAnatomique(item)));});
      box.appendChild(list);
    } else {
      box.appendChild(elem("p","structures-empty","À préciser par le Coach."));
    }
    return box;
  }

  function titreActiviteJour(s) {
    var type=typeof s.type==="string"&&s.type.trim()?s.type.trim():"";
    var id=typeof s.id==="string"?s.id:"";
    var title=typeof s.titre==="string"?s.titre:"";
    if(type==="kine"||id.startsWith("kine-"))return "Kiné";
    if(type==="course"||id.startsWith("course-")||title.startsWith("Course à pied"))return "Course à pied";
    if(type==="renfo"||id.startsWith("renfo-"))return "Renfo";
    if(type)return type.charAt(0).toLocaleUpperCase("fr-FR")+type.slice(1);
    return title||"Séance";
  }
  function resumeJour(sessions) {
    return sessions.length?sessions.map(titreActiviteJour).join(", "):"—";
  }
  function render() {
    var goals=document.getElementById("goalsList");goals.replaceChildren();
    (objectifs).forEach(function(g){if(typeof g==="string"&&g.trim())goals.appendChild(elem("li","",g));});
    var end=plus(weekStart,6);
    document.getElementById("rangeLabel").textContent=format(weekStart,{day:"numeric",month:"short"})+" – "+format(end,{day:"numeric",month:"short",year:"numeric"});
    var days=document.getElementById("days");days.replaceChildren();
    for (var i=0;i<7;i++) {
      var d=plus(weekStart,i), count=getDay(i).length;
      var btn=elem("button","day");
      btn.type="button";btn.dataset.day=String(i);
      btn.setAttribute("aria-pressed",String(i===dayIndex));
      var dailySessions=getDay(i),done=dailySessions.filter(isCompleted).length;
      btn.setAttribute("aria-label",format(d,{weekday:"long",day:"numeric",month:"long"})+", "+count+" séance(s), "+done+" terminée(s)");
      btn.appendChild(elem("span","short",format(d,{weekday:"short"})+(key(d)===key(today)?" · auj.":"")));
      btn.appendChild(elem("span","num",String(d.getDate())));
      btn.appendChild(elem("span","month",format(d,{month:"long"})));
      var label=resumeJour(dailySessions);
      var allCompleted=count>0&&done===count;
      btn.appendChild(elem("span","status"+(count?" planned":"")+(allCompleted?" complete":""),allCompleted?"✓ "+label:label));
      days.appendChild(btn);
    }
    var selected=plus(weekStart,dayIndex);
    document.getElementById("selectedDate").textContent=format(selected,{weekday:"long",day:"numeric",month:"long"});
    var dayContent=document.getElementById("dayContent");dayContent.replaceChildren();
    var sessions=getDay(dayIndex);
    if (!sessions.length) dayContent.appendChild(empty("Aucune séance programmée","Aucune séance prévue ce jour."));
    else {
      var cards=elem("div","sessions");
      sessions.forEach(function(s) {
        var box=elem("article","session"+(isCompleted(s)?" completed":""));
        var head=elem("div","session-head");
        head.appendChild(elem("h3","",s.titre||"Sortie"));
        var done=completionDisplay(s);
        if(done)head.appendChild(done);
        box.appendChild(head);
        if (metadata(s))box.appendChild(elem("p","meta",metadata(s)));
        box.appendChild(derouleDisplay(s));
        var fichier=fitDisplay(s);
        if(fichier)box.appendChild(fichier);
        var structures=structuresDisplay(s);
        if(structures)box.appendChild(structures);
        var note=sensationsDisplay(s);
        if(note)box.appendChild(note);
        cards.appendChild(box);
      });
      dayContent.appendChild(cards);
    }
    var all=document.getElementById("allContent");all.replaceChildren();
    var items=getWeek();
    if (!items.length)all.appendChild(empty("Aucune séance cette semaine","Aucune séance n'est programmée pour cette période."));
    else {
      var list=elem("div","week-list");
      items.forEach(function(s){
        var date=new Date(s.date+"T12:00:00");
        if (Number.isNaN(date.getTime()))return;
        var item=elem("div","week-item"+(isCompleted(s)?" completed":""));
        item.appendChild(elem("span","date",format(date,{weekday:"short",day:"numeric",month:"short"})));
        var body=elem("div","body");
        body.appendChild(elem("strong","",s.titre||"Sortie"));
        item.appendChild(body);
        var done=completionDisplay(s);
        if(done)item.appendChild(done);
        list.appendChild(item);
      });
      all.appendChild(list);
    }
  }

  function fetchJSON(url){
    return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.json();});
  }
  function afficherErreur(){
    document.getElementById("dayContent").replaceChildren(empty("Données indisponibles","La semaine n'a pas pu être chargée. Réessayez en revenant sur la page."));
    document.getElementById("allContent").replaceChildren(empty("Données indisponibles","Une actualisation sera effectuée à la prochaine ouverture."));
  }
  function chargerSemaine(){
    var week=key(weekStart),token=++requestToken;
    if(dataIndex.semaines.indexOf(week)===-1){currentSessions=[];render();return;}
    var pending=cache.get(week);
    if(!pending){
      pending=fetchJSON("./data/semaines/"+week+".json?v="+encodeURIComponent(dataIndex.buildVersion||"1"))
        .then(function(payload){
          if(!payload||payload.semaine!==week||!Array.isArray(payload.sessions))throw Error("Semaine incohérente");
          return payload.sessions;
        });
      cache.set(week,pending);
      if(cache.size>8)cache.delete(cache.keys().next().value);
    }
    pending.then(function(sessions){if(token!==requestToken)return;currentSessions=sessions;render();})
      .catch(function(){cache.delete(week);if(token===requestToken)afficherErreur();});
  }
  function chargerIndex(){
    var stamp=Date.now();
    fetchJSON("./data/index.json?actualisation="+stamp).then(function(index){
      if(!Array.isArray(index.semaines)||!Array.isArray(index.objectifs))throw Error("Index incomplet");
      dataIndex=index;objectifs=index.objectifs;cache.clear();chargerSemaine();
    }).catch(afficherErreur);
  }
  function refreshToday(){
    var fresh=new Date();
    if(key(fresh)===key(today))return;
    var showingCurrent=key(weekStart)===key(monday(today));
    var showingToday=key(plus(weekStart,dayIndex))===key(today);
    today=fresh;
    if(showingCurrent&&showingToday){weekStart=monday(today);dayIndex=(today.getDay()+6)%7;chargerSemaine();}
    else render();
    document.getElementById("todayLabel").textContent=format(today,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  }
  document.getElementById("todayLabel").textContent=format(today,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("previous").addEventListener("click",function(){weekStart=plus(weekStart,-7);dayIndex=0;chargerSemaine();});
  document.getElementById("following").addEventListener("click",function(){weekStart=plus(weekStart,7);dayIndex=0;chargerSemaine();});
  document.getElementById("reset").addEventListener("click",function(){today=new Date();weekStart=monday(today);dayIndex=(today.getDay()+6)%7;chargerSemaine();});
  document.getElementById("days").addEventListener("click",function(event){var button=event.target.closest("button[data-day]");if(button){dayIndex=Number(button.dataset.day);render();}});
  setInterval(refreshToday,60000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){refreshToday();chargerIndex();}});
  window.addEventListener("pageshow",function(event){if(event.persisted){refreshToday();chargerIndex();}});
  chargerIndex();
}());
</script>
