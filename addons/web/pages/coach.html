<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#234735">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="mon-rythme-version" content="2026-11-12-entete-mutualise-bandeaux-v31">
  <meta name="description" content="Objectif, intentions et points d'attention du Coach pour ma reprise.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Le cap du Coach · Mon Rythme</title>
  <style>
    :root{color-scheme:light;--ink:#233c2d;--green:#234735;--muted:#637c69;--line:#dfe7dd;--bg:#f7f9f5;--white:#fff;--soft:#e9f2e8;--gold:#f4e8d0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}a:focus-visible{outline:3px solid #8fba95;outline-offset:3px}
    .shell{width:min(1070px,calc(100% - 36px));margin:auto;padding-bottom:65px}
    header{min-height:87px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;font-size:20px;letter-spacing:-.5px;font-weight:800}
    .brand-icon{width:41px;height:41px;background:var(--green);border-radius:13px;color:white;display:grid;place-items:center;font-size:22px}
    .hero{background:radial-gradient(circle at 94% -10%,rgba(168,210,176,.32),transparent 33%),var(--green);color:white;border-radius:24px;padding:40px 43px 36px;position:relative;overflow:hidden}
    .eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#cce3cf;font-weight:800;margin:0 0 11px}
    h1{font-size:clamp(34px,5vw,53px);font-weight:800;letter-spacing:-1.8px;line-height:1.08;margin:0}
    .orientation-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:26px 28px}
    .phase{font-size:clamp(18px,3vw,22px);font-weight:760;color:var(--green);letter-spacing:-.45px;line-height:1.35;margin:0}
    .intro{color:#577260;font-size:15px;line-height:1.65;max-width:850px;margin:12px 0 0}
    .update{font-size:12px;color:var(--muted);margin:19px 0 0}
    section{margin-top:34px}
    .section-head{margin-bottom:17px}
    h2{font-size:24px;line-height:1.25;letter-spacing:-.75px;margin:0}
    .goal{display:flex;align-items:flex-start;gap:17px;padding:25px 28px;background:white;border:1px solid var(--line);border-radius:19px}
    .goal-symbol{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--green);font-size:27px;flex:none}
    .goal-text{font-size:clamp(18px,3vw,23px);font-weight:750;line-height:1.4;letter-spacing:-.35px;margin:0}
    .intents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .intent{min-width:0;background:white;border:1px solid var(--line);border-radius:18px;padding:23px 21px;display:flex;flex-direction:column;gap:12px}
    .pill{display:inline-block;align-self:start;color:#3c6b4b;background:#e8f2e9;font-size:11px;font-weight:760;padding:6px 10px;border-radius:99px}
    .intent h3{font-size:17px;line-height:1.3;margin:0;letter-spacing:-.35px}
    .intent p{color:#5e7664;font-size:13px;line-height:1.55;margin:0}
    .attention{background:#fff;border:1px solid var(--line);border-radius:19px;padding:7px 25px}
    .attention-item{display:flex;gap:15px;align-items:flex-start;padding:20px 0}
    .attention-item+.attention-item{border-top:1px solid #edf1eb}
    .attention-symbol{display:grid;place-items:center;width:35px;height:35px;background:#f7f1e5;border-radius:12px;color:#977443;font-size:19px;flex:none}
    .attention-item h3{font-size:15px;margin:0 0 5px}
    .attention-item p{font-size:13px;color:#637569;margin:0;line-height:1.6}
    .empty{padding:23px;color:#65776a;background:white;border:1px dashed #cadbce;border-radius:16px;font-size:14px}
    .readmore{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 23px;border:1px solid #d8e5da;background:#edf5eb;border-radius:16px;font-size:13px;color:#4d6a54;margin-top:29px}
    .readmore a{text-decoration:none;font-weight:750;color:#234735;white-space:nowrap}
    .readmore a:hover{text-decoration:underline}
    @media(max-width:760px){.intents{grid-template-columns:1fr}.intent{gap:8px}.hero{padding:32px 27px}.goal{padding:20px}.readmore{flex-direction:column;align-items:flex-start}}
    @media(max-width:530px){.shell{width:calc(100% - 26px)}header{min-height:73px}.brand{font-size:18px}.hero{border-radius:19px}.goal{gap:12px}.goal-symbol{width:38px;height:38px;font-size:22px}section{margin-top:27px}h2{font-size:22px}.attention{padding:3px 17px}}
    @media print{body{background:white}.hero{background:white;color:var(--ink);border:1px solid var(--line)}.eyebrow{color:var(--ink)}}
  </style>
  <link rel="stylesheet" href="./style-commun.css?v=2026-11-12-entete-mutualise-bandeaux-v31">
  <script defer src="./en-tete.js?v=2026-11-12-entete-mutualise-bandeaux-v31"></script>
</head>
<body>
  <div class="shell">
    <div data-mon-rythme-en-tete="coach"></div>
    <main>
      <div class="hero">
        <div class="hero-copy"><h1>Le cap du Coach.</h1></div>
        <div class="hero-mark" aria-hidden="true">
          <svg viewBox="0 0 50 50"><circle cx="24" cy="26" r="17"/><circle cx="24" cy="26" r="9"/><path d="M24 26 41 9M34 9h7v7"/></svg>
        </div>
      </div>
      <section aria-labelledby="objectiveTitle">
        <div class="section-head"><h2 id="objectiveTitle">Mon objectif personnel</h2></div>
        <div class="goal">
          <div class="goal-symbol" aria-hidden="true">◎</div>
          <div><p class="goal-text" id="coachObjective">Chargement de l'objectif…</p></div>
        </div>
      </section>
      <section aria-labelledby="orientationTitle">
        <div class="section-head"><h2 id="orientationTitle">L'orientation du Coach</h2></div>
        <div class="orientation-card">
          <h3 class="phase" id="coachPhase">Chargement de l'orientation…</h3>
          <p class="intro" id="coachDirection"></p>
          <p class="update" id="coachDate"></p>
        </div>
      </section>
      <section aria-labelledby="trendsTitle">
        <div class="section-head"><h2 id="trendsTitle">Ce qu'il envisage</h2></div>
        <div id="coachTrends" class="intents" aria-live="polite"><div class="empty">Chargement des orientations…</div></div>
      </section>
      <section aria-labelledby="watchTitle">
        <div class="section-head"><h2 id="watchTitle">Ses points d'attention</h2></div>
        <div id="coachWatch" class="attention" aria-live="polite"><div class="empty">Chargement des points d'attention…</div></div>
      </section>
    </main>
  </div>
  <script>
    (function(){
      "use strict";
      function el(tag,cls,value){
        var item=document.createElement(tag);
        if(cls)item.className=cls;
        if(value!==undefined)item.textContent=value;
        return item;
      }
      function showList(id,items,render){
        var root=document.getElementById(id);root.replaceChildren();
        if(!items||!items.length){root.appendChild(el("div","empty","Aucun élément renseigné actuellement."));return;}
        items.forEach(function(item){root.appendChild(render(item));});
      }
      function renderTrend(t){
        var card=el("article","intent");
        card.appendChild(el("span","pill",t.horizon));
        card.appendChild(el("h3","",t.intention));
        card.appendChild(el("p","",t.condition));
        return card;
      }
      function renderWatch(w){
        var block=el("article","attention-item");
        block.appendChild(el("span","attention-symbol","◌"));
        var body=el("div");
        body.appendChild(el("h3","",w.sujet));
        body.appendChild(el("p","",w.attention));
        block.appendChild(body);
        return block;
      }
      function display(data){
        if(!data||data.schemaVersion!==1||!Array.isArray(data.tendances)||!Array.isArray(data.vigilances))throw Error("Orientation indisponible");
        document.getElementById("coachPhase").textContent=data.phase||"";
        document.getElementById("coachDirection").textContent=data.ligneDirectrice||"";
        document.getElementById("coachObjective").textContent=data.objectifPersonnel||"Objectif à préciser avec le Coach.";
        var date=new Date(data.miseAJour+"T12:00:00");
        document.getElementById("coachDate").textContent=isNaN(date.getTime())?"":"Orientation actualisée le "+new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",year:"numeric"}).format(date);
        showList("coachTrends",data.tendances,renderTrend);
        showList("coachWatch",data.vigilances,renderWatch);
      }
      function error(){
        document.getElementById("coachPhase").textContent="Orientation non disponible";
        document.getElementById("coachDirection").textContent="Le Coach n'a pas de synthèse publiée dans cette version du site.";
        document.getElementById("coachDate").textContent="";
        document.getElementById("coachObjective").textContent="À retrouver dans mon programme.";
        showList("coachTrends",[],renderTrend);
        showList("coachWatch",[],renderWatch);
      }
      var current=0;
      function load(){
        var token=++current;
        fetch("./data/coaching/orientation.json",{cache:"no-store"})
          .then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.json();})
          .then(function(d){if(token===current)display(d);})
          .catch(function(){if(token===current)error();});
      }
      load();
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")load();});
      window.addEventListener("pageshow",function(e){if(e.persisted)load();});
    }());
  </script>
</body>
</html>
